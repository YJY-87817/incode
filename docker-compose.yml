# 開發 / 測試用 SQL Server（不要用於正式環境）
#
#   啟動：docker compose up -d        第一次啟動會自動建立資料庫並執行 docs/database/schema.sql、seed.sql
#   停止：docker compose down
#   重建：docker compose down -v && docker compose up -d   （-v 會刪除資料，回到全新的資料庫）
#
# 連線字串（後端以 launchSettings 的 "https (Docker DB)" profile 啟動時會自動使用）：
#   Server=localhost,1433;Database=incodedatabase;User Id=sa;Password=Incode_Dev_2026!;TrustServerCertificate=True
# 密碼可用環境變數 MSSQL_SA_PASSWORD 覆寫（需符合 SQL Server 密碼複雜度：8 碼以上，含大小寫、數字、符號）

name: incode

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Incode_Dev_2026!}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # 等資料庫就緒後建立 incodedatabase、執行建表與基本資料腳本，完成後結束
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Incode_Dev_2026!}
      DB_HOST: db
      DB_NAME: incodedatabase
    volumes:
      - ./docs/database:/scripts:ro
      - ./docker/db/init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: "no"

volumes:
  mssql-data:
