name: CI

# 每個 PR 與推送到 main 時，分別建置後端與前端。
# 在 Linux 上建置，可擋下 Windows / macOS 不會發現的檔名大小寫錯誤。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 後端 (dotnet build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore incode.sln

      - name: Build
        run: dotnet build incode.sln --no-restore --configuration Release

  frontend:
    name: 前端 (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incode.Vue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: incode.Vue/package-lock.json

      # 依 package-lock.json 安裝（版本固定；lockfile 與 package.json 不一致時會失敗）
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
